spring.application.name=frota
server.port=8010

# Banco: valores padrao para rodar pelo IntelliJ com o docker-compose.
# No Docker, as variaveis de ambiente sobrescrevem estes valores.
spring.datasource.url=${DATASOURCE_URL:jdbc:postgresql://localhost:5410/frota}
spring.datasource.username=${DATASOURCE_USERNAME:frota}
spring.datasource.password=${DATASOURCE_PASSWORD:frota}

# JPA: cria/atualiza as tabelas a partir das entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
