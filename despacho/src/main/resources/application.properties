spring.application.name=despacho
server.port=8012

# Banco: valores padrao para rodar pelo IntelliJ com o docker-compose.
# No Docker, as variaveis de ambiente sobrescrevem estes valores.
spring.datasource.url=${DATASOURCE_URL:jdbc:postgresql://localhost:5412/despacho}
spring.datasource.username=${DATASOURCE_USERNAME:despacho}
spring.datasource.password=${DATASOURCE_PASSWORD:despacho}

# JPA: cria/atualiza as tabelas a partir das entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
